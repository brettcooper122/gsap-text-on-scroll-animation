<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scroll-Scrubbed Text Animation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="spacer"></div>

    <div class="text-container">
        <h1 id="animated-text">
            The quick brown fox jumps over the lazy dog. This text will smoothly reveal character by character as you scroll down, and reverse back to grey as you scroll up. Watch the magic happen!
        </h1>
    </div>

    <div class="spacer"></div>

    <!-- GSAP and ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
