<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scroll-Scrubbed Text Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Editors+Note&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Editors Note', cursive;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        /* Spacers to enable scrolling */
        .spacer {
            height: 100vh;
        }

        /* Text container styling */
        .text-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        #animated-text {
            font-size: 3rem;
            font-weight: bold;
            line-height: 1.5;
            max-width: 1200px;
            text-align: center;
        }

        /* Individual character styling */
        #animated-text span {
            display: inline-block;
            color: #444444;
            transition: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            #animated-text {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            #animated-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="spacer"></div>

    <div class="text-container">
        <h1 id="animated-text">
            The quick brown fox jumps over the lazy dog. This text will smoothly reveal character by character as you scroll down, and reverse back to grey as you scroll up. Watch the magic happen!
        </h1>
    </div>

    <div class="spacer"></div>

    <!-- GSAP and ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        // Wait for window to fully load (including GSAP scripts)
        window.addEventListener('load', function() {
            console.log('Initializing GSAP ScrollTrigger animation...');

            // Register ScrollTrigger plugin
            gsap.registerPlugin(ScrollTrigger);

            // Get the text element
            const textElement = document.getElementById('animated-text');
            if (!textElement) {
                console.error('Text element not found!');
                return;
            }

            const originalText = textElement.textContent.trim();
            console.log('Original text:', originalText);

            // Split text into individual characters and wrap each in a span
            textElement.innerHTML = originalText
                .split('')
                .map(char => {
                    // Preserve spaces properly
                    if (char === ' ') {
                        return '<span class="char">&nbsp;</span>';
                    }
                    return `<span class="char">${char}</span>`;
                })
                .join('');

            // Get all character spans
            const chars = textElement.querySelectorAll('.char');
            console.log('Total characters:', chars.length);

            // Set initial color explicitly
            gsap.set(chars, { color: '#444444' });

            // Create a timeline for the animation
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: '.text-container',
                    pin: true,
                    start: 'center center',
                    end: '+=100%',
                    scrub: 1,
                    markers: true,
                    onEnter: () => console.log('ScrollTrigger entered'),
                    onLeave: () => console.log('ScrollTrigger left'),
                    onEnterBack: () => console.log('ScrollTrigger entered back'),
                    onLeaveBack: () => console.log('ScrollTrigger left back'),
                    onUpdate: (self) => {
                        console.log('Progress:', (self.progress * 100).toFixed(1) + '%');
                    }
                }
            });

            // Add the color animation to the timeline
            tl.to(chars, {
                color: '#1a1a1a',
                stagger: 0.1,
                ease: 'none',
                duration: 1
            });

            console.log('GSAP ScrollTrigger animation initialized successfully!');
            console.log('Scroll to center of viewport to see animation');
        });
    </script>
</body>
</html>
