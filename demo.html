<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Scroll-Scrubbed Text Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            overflow-x: hidden;
        }

        /* Spacers to enable scrolling */
        .spacer {
            height: 100vh;
        }

        /* Text container styling */
        .text-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        #animated-text {
            font-size: 3rem;
            font-weight: bold;
            line-height: 1.5;
            max-width: 1200px;
            text-align: center;
        }

        /* Individual character styling */
        #animated-text span {
            display: inline-block;
            color: #808080;
            transition: none;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            #animated-text {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            #animated-text {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="spacer"></div>

    <div class="text-container">
        <h1 id="animated-text">
            The quick brown fox jumps over the lazy dog. This text will smoothly reveal character by character as you scroll down, and reverse back to grey as you scroll up. Watch the magic happen!
        </h1>
    </div>

    <div class="spacer"></div>

    <!-- GSAP and ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script>
        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Register ScrollTrigger plugin
            gsap.registerPlugin(ScrollTrigger);

            // Get the text element
            const textElement = document.getElementById('animated-text');
            const text = textElement.textContent;

            // Split text into individual characters and wrap each in a span
            textElement.innerHTML = text
                .split('')
                .map(char => {
                    // Preserve spaces properly
                    if (char === ' ') {
                        return '<span>&nbsp;</span>';
                    }
                    return `<span>${char}</span>`;
                })
                .join('');

            // Get all character spans
            const chars = textElement.querySelectorAll('span');

            // Create the scroll-scrubbed animation
            gsap.fromTo(
                chars,
                {
                    // Initial state: grey
                    color: '#808080'
                },
                {
                    // Final state: black
                    color: '#000000',

                    // Stagger effect - creates the wave of color change
                    stagger: 0.1,

                    // Perfectly linear easing
                    ease: 'none',

                    // ScrollTrigger configuration
                    scrollTrigger: {
                        trigger: '.text-container',
                        start: 'top 80%',
                        end: 'top 20%',
                        scrub: 1,
                        markers: true,
                        onUpdate: (self) => {
                            console.log('Animation progress:', self.progress.toFixed(2));
                        }
                    }
                }
            );

            console.log('GSAP Scroll-Scrubbed Text Animation initialized!');
            console.log('Total characters animated:', chars.length);
            console.log('Scroll down to see characters turn black, scroll up to see them return to grey');
        });
    </script>
</body>
</html>
